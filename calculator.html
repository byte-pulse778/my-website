<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Calculator</title>
    <style>
        html, body {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            margin: 0; padding: 0;
            background: #f5f5f5;
            font-family: -apple-system, "Helvetica Neue", "PingFang SC", sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        .display {
            position: absolute;
            left: 0; right: 0;
            top: env(safe-area-inset-top, 0px);
            height: 240px;
            background: #f5f5f5;
            padding: 20px 24px 15px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            z-index: 1;
        }
        .expression {
            color: #999;
            font-size: 17px;
            min-height: 22px;
            text-align: right;
        }
        .current {
            color: #222;
            font-size: 56px;
            font-weight: 300;
            text-align: right;
            margin-top: 6px;
            line-height: 1.1;
        }
        .buttons {
            position: absolute;
            top: 240px; left: 0; right: 0; bottom: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 1px;
            background: #e8e8e8;
        }
        .btn {
            border: none;
            font-size: 24px;
            font-weight: 400;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            color: #333;
            padding: 0;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.1s;
        }
        .btn:active { background: #e0e0e0; }
        .op { color: #ff9f0a; font-size: 28px; }
        .op:active { background: #f0e0c0; }
        .func { color: #00897b; font-size: 22px; }
        .func:active { background: #d0e8e4; }
        .equal { background: #ff9f0a; color: #fff; font-size: 28px; }
        .equal:active { background: #e8900a; }
        .zero { grid-column: span 2; }
    </style>
</head>
<body>
    <div class="display">
        <div class="expression" id="expression"></div>
        <div class="current" id="current">0</div>
    </div>
    <div class="buttons">
        <button class="btn func" onclick="clearAll()">AC</button>
        <button class="btn func" onclick="backspace()">⌫</button>
        <button class="btn func" onclick="percent()">%</button>
        <button class="btn op" onclick="setOp('/')">÷</button>
        <button class="btn" onclick="addNum('7')">7</button>
        <button class="btn" onclick="addNum('8')">8</button>
        <button class="btn" onclick="addNum('9')">9</button>
        <button class="btn op" onclick="setOp('*')">×</button>
        <button class="btn" onclick="addNum('4')">4</button>
        <button class="btn" onclick="addNum('5')">5</button>
        <button class="btn" onclick="addNum('6')">6</button>
        <button class="btn op" onclick="setOp('-')">−</button>
        <button class="btn" onclick="addNum('1')">1</button>
        <button class="btn" onclick="addNum('2')">2</button>
        <button class="btn" onclick="addNum('3')">3</button>
        <button class="btn op" onclick="setOp('+')">+</button>
        <button class="btn zero" onclick="addNum('0')">0</button>
        <button class="btn" onclick="addDot()">.</button>
        <button class="btn equal" onclick="calc()">=</button>
    </div>
    <script>
        var current = '0', expression = '', operator = null, prevNum = null, resetNext = false;
        var dc = document.getElementById('current');
        var de = document.getElementById('expression');
        function updateDisplay() {
            var display = current;
            if (display.length > 12) {
                var num = parseFloat(display);
                if (Math.abs(num) >= 1e12 || (Math.abs(num) < 0.0001 && num !== 0)) {
                    display = num.toExponential(5);
                } else {
                    display = display.substring(0, 12);
                }
            }
            dc.innerText = display;
            de.innerText = expression;
        }
        function addNum(n) {
            if (resetNext) { current = ''; resetNext = false; }
            if (current === '0' && n !== '0') current = n;
            else if (current === '-0') current = '-' + n;
            else if (current.length < 15) current = current + n;
            updateDisplay();
        }
        function addDot() {
            if (resetNext) { current = '0'; resetNext = false; }
            if (current.indexOf('.') === -1) current += '.';
            updateDisplay();
        }
        function setOp(op) {
            if (operator && !resetNext) calc();
            prevNum = parseFloat(current);
            operator = op;
            var s = op === '*' ? '×' : op === '/' ? '÷' : op;
            expression = prevNum + ' ' + s;
            resetNext = true;
            updateDisplay();
        }
        function calc() {
            if (!operator || prevNum === null) return;
            var a = prevNum, b = parseFloat(current), r;
            if (operator === '+') r = a + b;
            else if (operator === '-') r = a - b;
            else if (operator === '*') r = a * b;
            else if (operator === '/') r = b === 0 ? 'Error' : a / b;
            if (typeof r === 'number') r = parseFloat(r.toPrecision(12));
            var sym = operator === '+' ? '+' : operator === '-' ? '−' : operator === '*' ? '×' : '÷';
            expression = prevNum + ' ' + sym + ' ' + current + ' =';
            current = String(r);
            operator = null;
            prevNum = null;
            resetNext = true;
            updateDisplay();
        }
        function clearAll() {
            current = '0'; expression = ''; operator = null; prevNum = null; resetNext = false;
            updateDisplay();
        }
        function backspace() {
            if (resetNext) return;
            current = current.length <= 1 || (current.length === 2 && current[0] === '-') ? '0' : current.slice(0, -1);
            updateDisplay();
        }
        function percent() {
            current = String(parseFloat(current) / 100);
            updateDisplay();
        }
    </script>
</body>
</html>
