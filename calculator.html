<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculator</title>
    <style>
        html, body {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            margin: 0; padding: 0;
            background: #0c0c1d;
            font-family: -apple-system, sans-serif;
            overflow: hidden;
            -webkit-appearance: none;
        }
        .display {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 28%;
            background: #0c0c1d;
            padding: 20px 20px 10px;
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .expression {
            color: #888;
            font-size: 16px;
            min-height: 20px;
            word-break: break-all;
        }
        .current {
            color: #fff;
            font-size: 48px;
            font-weight: bold;
            word-break: break-all;
            margin-top: 5px;
        }
        .buttons {
            position: absolute;
            top: 28%; left: 0; right: 0; bottom: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 2px;
            background: #111;
        }
        .btn {
            border: none;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            padding: 0;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { opacity: 0.6; }
        .num { color: #fff; background: #2d2d3f; }
        .op { color: #fff; background: #ff9f0a; font-size: 26px; }
        .func { color: #aaa; background: #3a3a4f; }
        .equal { color: #fff; background: #30d158; font-size: 26px; }
        .zero { grid-column: span 2; }
    </style>
</head>
<body>
    <div class="display">
        <div class="expression" id="expression"></div>
        <div class="current" id="current">0</div>
    </div>
    <div class="buttons">
        <button class="btn func" onclick="clearAll()">AC</button>
        <button class="btn func" onclick="backspace()">⌫</button>
        <button class="btn func" onclick="percent()">%</button>
        <button class="btn op" onclick="setOp('/')">÷</button>
        <button class="btn num" onclick="addNum('7')">7</button>
        <button class="btn num" onclick="addNum('8')">8</button>
        <button class="btn num" onclick="addNum('9')">9</button>
        <button class="btn op" onclick="setOp('*')">×</button>
        <button class="btn num" onclick="addNum('4')">4</button>
        <button class="btn num" onclick="addNum('5')">5</button>
        <button class="btn num" onclick="addNum('6')">6</button>
        <button class="btn op" onclick="setOp('-')">−</button>
        <button class="btn num" onclick="addNum('1')">1</button>
        <button class="btn num" onclick="addNum('2')">2</button>
        <button class="btn num" onclick="addNum('3')">3</button>
        <button class="btn op" onclick="setOp('+')">+</button>
        <button class="btn num zero" onclick="addNum('0')">0</button>
        <button class="btn num" onclick="addDot()">.</button>
        <button class="btn equal" onclick="calc()">=</button>
    </div>
    <script>
        var current = '0', expression = '', operator = null, prevNum = null, resetNext = false;
        var dc = document.getElementById('current');
        var de = document.getElementById('expression');
        function updateDisplay() { dc.innerText = current; de.innerText = expression; }
        function addNum(n) { if (resetNext) { current = ''; resetNext = false; } current = current === '0' ? n : current + n; updateDisplay(); }
        function addDot() { if (resetNext) { current = ''; resetNext = false; } if (current.indexOf('.') === -1) current += '.'; updateDisplay(); }
        function setOp(op) { if (operator && !resetNext) calc(); prevNum = parseFloat(current); operator = op; var s = op === '*' ? '×' : op === '/' ? '÷' : op === '-' ? '−' : op; expression = prevNum + ' ' + s; resetNext = true; updateDisplay(); }
        function calc() { if (!operator || prevNum === null) return; var a = prevNum, b = parseFloat(current), r; if (operator === '+') r = a + b; else if (operator === '-') r = a - b; else if (operator === '*') r = a * b; else if (operator === '/') { r = b === 0 ? 'Error' : a / b; } if (typeof r === 'number') r = parseFloat(r.toPrecision(12)); expression = a + ' ' + getSymbol() + ' ' + b + ' ='; current = String(r); operator = null; prevNum = null; resetNext = true; updateDisplay(); }
        function getSymbol() { return operator === '+' ? '+' : operator === '-' ? '−' : operator === '*' ? '×' : operator === '/' ? '÷' : ''; }
        function clearAll() { current = '0'; expression = ''; operator = null; prevNum = null; resetNext = false; updateDisplay(); }
        function backspace() { if (resetNext) return; current = current.length === 1 || (current.length === 2 && current[0] === '-') ? '0' : current.slice(0, -1); updateDisplay(); }
        function percent() { current = String(parseFloat(current) / 100); updateDisplay(); }
    </script>
</body>
</html>
